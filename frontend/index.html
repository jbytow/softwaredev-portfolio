<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/coffee.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Software developer portfolio showcasing projects, experience, and technical skills" />
    <!-- Applies the saved colour preset before the first paint; keep the names in sync with lib/themePresets.ts (test/theme-init.test.ts checks it) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          var known = ['emerald', 'coffee', 'mountain', 'terminal', 'neon', 'violet', 'cyber'];
          if (known.indexOf(theme) !== -1) document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <title>Dev Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
