events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Behind Cloudflare Tunnel every request comes from the connector, so $remote_addr is the
    # same for all visitors. Cloudflare overwrites CF-Connecting-IP with the visitor address;
    # requests that reach port 80 directly (no header) fall back to the socket address.
    # Port 80 is published on loopback only (docker-compose.prod.yml), so a LAN client cannot
    # reach it to forge the header.
    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # Rate limiting (per visitor)
    limit_req_zone $client_ip zone=api:10m rate=10r/s;
    limit_req_zone $client_ip zone=media:10m rate=30r/s;
    limit_req_zone $client_ip zone=oauth:1m rate=10r/m;
    # Every accepted contact POST sends a mail, so one visitor must not be able to drain the
    # Gmail sending quota through the much looser api zone
    limit_req_zone $client_ip zone=contact:1m rate=5r/m;
    limit_req_zone $client_ip zone=general:10m rate=30r/s;
    limit_req_status 429;

    # Docker's embedded DNS: "resolve" re-reads container IPs after a deploy recreates a
    # container, so the edge does not keep proxying to a stale address (needs nginx >= 1.27.3)
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone upstream_backend 64k;
        server backend:8080 resolve;
    }

    upstream frontend {
        zone upstream_frontend 64k;
        server frontend:80 resolve;
    }

    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS in production
        # Uncomment when SSL is configured
        # return 301 https://$server_name$request_uri;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Uncomment after SSL is configured:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://github.com;" always;

        # Client max body size for file uploads
        client_max_body_size 50M;

        # Shared by every proxied location; a location that sets its own proxy_set_header
        # would drop all of these (same inheritance rule as add_header).
        # Client-supplied forwarding headers are overwritten or cleared because Spring
        # (forward-headers-strategy: framework) trusts them, including for the OAuth redirect_uri.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";

        # Images and files: many per page, so they get their own, looser bucket
        location /api/media/ {
            limit_req zone=media burst=100 nodelay;
            proxy_pass http://backend;
        }

        # Exact match so only the mail-sending endpoint gets the strict bucket; proxy headers
        # are inherited from the server block
        location = /api/contact {
            limit_req zone=contact burst=3 nodelay;
            proxy_pass http://backend;
        }

        # API routes - forward to backend (keep /api prefix, backend expects it)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
        }

        # OAuth routes: each authorization request creates a server-side session
        location /oauth2/ {
            limit_req zone=oauth burst=10 nodelay;
            proxy_pass http://backend;
        }

        location /login/oauth2/ {
            limit_req zone=oauth burst=10 nodelay;
            proxy_pass http://backend;
        }

        # Frontend routes
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://frontend;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
